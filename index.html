<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Tracker</title>
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Tracker%22%2C%22short_name%22%3A%22Tracker%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23ffffff%22%2C%22theme_color%22%3A%22%234caf50%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%20100%20100'%3E%3Crect%20width%3D'100'%20height%3D'100'%20rx%3D'20'%20fill%3D'%234caf50'%2F%3E%3Ctext%20x%3D'50'%20y%3D'68'%20font-size%3D'50'%20text-anchor%3D'middle'%20fill%3D'white'%20font-family%3D'sans-serif'%3E%E2%9A%96%3C%2Ftext%3E%3C%2Fsvg%3E%22%2C%22sizes%22%3A%22100x100%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f5;
      color: #1e1e1e;
      max-width: 480px;
      margin: 0 auto;
      padding: 0 0 70px 0;
      line-height: 1.4;
      -webkit-tap-highlight-color: transparent;
    }
    h1, h2 { margin: 0.8rem 0; }
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 1.2rem;
      margin: 0 1rem 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .progress-bar { height: 14px; background: #e0e0e0; border-radius: 7px; overflow: hidden; margin: 0.5rem 0; }
    .progress-fill { height: 100%; background: #4caf50; transition: width 0.4s; border-radius: 7px; }
    .flex-row { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    button, .btn {
      background: #4caf50; color: white; border: none; padding: 0.7rem 1rem; border-radius: 10px;
      font-size: 1rem; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 0.3rem; transition: 0.2s;
    }
    button.secondary { background: #e0e0e0; color: #333; }
    button.danger { background: #ff5252; }
    button:active { opacity: 0.7; transform: scale(0.97); }
    input, select {
      background: #fff; color: #1e1e1e; border: 1px solid #ccc; padding: 0.7rem; border-radius: 10px;
      font-size: 1rem; width: 100%; margin: 0.3rem 0;
    }
    .hidden { display: none !important; }
    .log-entry { display: flex; justify-content: space-between; align-items: center; padding: 0.6rem 0; border-bottom: 1px solid #eee; }
    .badge { background: #e8f5e9; padding: 0.15rem 0.5rem; border-radius: 12px; font-size: 0.8rem; font-weight: 500; }
    .tab-bar {
      position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto;
      display: flex; background: #ffffff; border-top: 1px solid #ddd;
      padding: 0.5rem 0 env(safe-area-inset-bottom, 0); justify-content: space-around; z-index: 10;
    }
    .tab-btn {
      background: none; border: none; color: #888; font-size: 0.75rem;
      display: flex; flex-direction: column; align-items: center; padding: 0.3rem 0.5rem; border-radius: 12px; transition: 0.2s; cursor: pointer;
    }
    .tab-btn.active { color: #4caf50; font-weight: 600; }
    .tab-btn svg { width: 24px; height: 24px; margin-bottom: 0.1rem; }
    .section-title { font-size: 1.2rem; font-weight: 600; margin: 1rem 1rem 0.5rem; }
    .small { font-size: 0.85rem; color: #666; }
    .macro { font-weight: 600; }
    .delete-entry { background: none; border: none; color: #aaa; font-size: 1.2rem; padding: 0 0.3rem; cursor: pointer; }
    .food-item {
      display: flex; justify-content: space-between; align-items: center; padding: 0.8rem; border-radius: 12px; background: #f9f9f9; margin-bottom: 0.5rem;
    }
    .food-item button { padding: 0.4rem 0.8rem; font-size: 0.9rem; }
    #photo-preview { max-width: 200px; margin: 1rem auto; border-radius: 12px; display: block; }
  </style>
</head>
<body>
  <div id="home-view">
    <h2 class="section-title">📊 Heute</h2>
    <div class="card">
      <div class="flex-row"><span>Kalorien</span><span id="kcal-display">0 / 2900 kcal</span></div>
      <div class="progress-bar"><div id="kcal-bar" class="progress-fill" style="width:0%"></div></div>
      <div class="flex-row"><span>Protein</span><span id="protein-display">0 / 175 g</span></div>
      <div class="progress-bar"><div id="protein-bar" class="progress-fill" style="width:0%"></div></div>
    </div>
    <h3 style="margin:0 1rem 0.5rem;">Mahlzeiten</h3>
    <div id="log-list" class="card" style="min-height:100px"><p class="small">Noch keine Einträge.</p></div>
  </div>

  <!-- Foto-Scan View -->
  <div id="photo-view" class="hidden">
    <h2 class="section-title">📸 Datenblatt scannen</h2>
    <div class="card">
      <input type="file" id="photo-input" accept="image/*" capture="environment" class="hidden">
      <button id="take-photo-btn">📷 Foto vom Datenblatt machen</button>
      <div id="ocr-status" class="small" style="margin-top:0.5rem;"></div>
      <img id="photo-preview" class="hidden" src="" alt="Vorschau">

      <div id="ocr-result" class="hidden">
        <p><strong>Erkannte Werte (pro 100 g):</strong></p>
        <label>Name: <input type="text" id="ocr-name" placeholder="z.B. Marmelade"></label>
        <label>Kalorien (kcal): <input type="number" id="ocr-kcal" step="0.1"></label>
        <label>Protein (g): <input type="number" id="ocr-protein" step="0.1"></label>
        <label>Packungsgewicht (g, optional): <input type="number" id="ocr-pack-weight" step="1"></label>
        <button id="save-ocr-btn">💾 Lebensmittel speichern</button>
      </div>
    </div>

    <div id="saved-foods-section" style="margin-top:1rem;">
      <h3 style="margin-left:1rem;">Deine fotografierten Lebensmittel</h3>
      <div id="saved-foods-list" class="card" style="min-height:60px;">
        <p class="small">Noch keine gespeichert.</p>
      </div>
    </div>

    <!-- Dialog zum Hinzufügen eines gespeicherten Lebensmittels -->
    <div id="add-food-dialog" class="hidden card" style="margin-top:1rem;">
      <h3 id="add-food-name"></h3>
      <p class="small">pro 100g: <span id="add-food-kcal"></span> kcal, <span id="add-food-protein"></span> g Protein</p>
      <label>Menge (g): <input type="number" id="add-food-amount" value="100" min="1" step="1"></label>
      <button id="add-food-confirm-btn">✅ Hinzufügen</button>
      <button class="secondary" id="add-food-cancel-btn">Abbrechen</button>
    </div>
  </div>

  <!-- Manuelle Eingabe (fast unverändert) -->
  <div id="manual-view" class="hidden">
    <h2 class="section-title">✍️ Manuell</h2>
    <div class="card">
      <select id="custom-food-select"><option value="">-- Eigenes Lebensmittel --</option></select>
      <p class="small" style="margin-top:1rem;">Oder neu anlegen:</p>
      <input type="text" id="new-food-name" placeholder="Name (z.B. Apfel)">
      <div class="flex-row">
        <input type="number" id="new-food-kcal" placeholder="kcal/100g" step="0.1">
        <input type="number" id="new-food-protein" placeholder="Protein/100g" step="0.1">
      </div>
      <input type="text" id="new-food-portion-desc" placeholder="Portion (z.B. 1 Stück=80g)">
      <div class="flex-row" style="margin-top:0.5rem;">
        <label>Menge: <input type="number" id="manual-amount" value="100" min="1" step="1" style="width:80px;"></label>
        <select id="manual-unit"><option value="g">g</option><option value="portion">Portion</option></select>
      </div>
      <button id="add-manual-btn" style="margin-top:1rem;">Hinzufügen</button>
    </div>
  </div>

  <div id="settings-view" class="hidden">
    <h2 class="section-title">⚙️ Einstellungen</h2>
    <div class="card">
      <label>Kalorienziel: <input type="number" id="goal-kcal" value="2900"></label>
      <label>Proteinziel (g): <input type="number" id="goal-protein" value="175"></label>
      <button id="save-settings-btn" style="margin-top:1rem;">Speichern</button>
    </div>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" data-view="home"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 12h3v8h6v-6h2v6h6v-8h3L12 2z"/></svg>Heute</button>
    <button class="tab-btn" data-view="photo"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16a2 2 0 012 2v12a2 2 0 01-2 2H4a2 2 0 01-2-2V6a2 2 0 012-2zm0 2v12h16V6H4zm8 2a3 3 0 110 6 3 3 0 010-6zm0 2a1 1 0 100 2 1 1 0 000-2z"/></svg>Foto</button>
    <button class="tab-btn" data-view="manual"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4a4 4 0 014 4 4 4 0 01-4 4 4 4 0 01-4-4 4 4 0 014-4m0 10c4.42 0 8 1.79 8 4v2H4v-2c0-2.21 3.58-4 8-4z"/></svg>Manuell</button>
    <button class="tab-btn" data-view="settings"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12,15.5A3.5,3.5 0 0,1 8.5,12A3.5,3.5 0 0,1 12,8.5A3.5,3.5 0 0,1 15.5,12A3.5,3.5 0 0,1 12,15.5M19.43,12.97C19.47,12.65 19.5,12.33 19.5,12C19.5,11.67 19.47,11.34 19.43,11L21.54,9.37C21.73,9.22 21.78,8.95 21.66,8.73L19.66,5.27C19.54,5.05 19.27,4.96 19.05,5.05L16.56,6.05C16.04,5.66 15.5,5.32 14.87,5.07L14.5,2.42C14.46,2.18 14.25,2 14,2H10C9.75,2 9.54,2.18 9.5,2.42L9.13,5.07C8.5,5.32 7.96,5.66 7.44,6.05L4.95,5.05C4.73,4.96 4.46,5.05 4.34,5.27L2.34,8.73C2.21,8.95 2.27,9.22 2.46,9.37L4.57,11C4.53,11.34 4.5,11.67 4.5,12C4.5,12.33 4.53,12.65 4.57,12.97L2.46,14.63C2.27,14.78 2.21,15.05 2.34,15.27L4.34,18.73C4.46,18.95 4.73,19.03 4.95,18.95L7.44,17.94C7.96,18.34 8.5,18.68 9.13,18.93L9.5,21.58C9.54,21.82 9.75,22 10,22H14C14.25,22 14.46,21.82 14.5,21.58L14.87,18.93C15.5,18.68 16.04,18.34 16.56,17.94L19.05,18.95C19.27,19.03 19.54,18.95 19.66,18.73L21.66,15.27C21.78,15.05 21.73,14.78 21.54,14.63L19.43,12.97Z"/></svg>Einst.</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script>
    (function() {
      const DB_NAME = 'tracker_v6';
      let db;
      const request = indexedDB.open(DB_NAME, 1);
      request.onupgradeneeded = (e) => {
        db = e.target.result;
        if (!db.objectStoreNames.contains('logs')) db.createObjectStore('logs', { keyPath: 'id', autoIncrement: true });
        if (!db.objectStoreNames.contains('customFoods')) db.createObjectStore('customFoods', { keyPath: 'id', autoIncrement: true });
        if (!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', { keyPath: 'key' });
        if (!db.objectStoreNames.contains('photoFoods')) db.createObjectStore('photoFoods', { keyPath: 'id', autoIncrement: true });
      };
      request.onsuccess = (e) => { db = e.target.result; initApp(); };

      let currentView = 'home';
      let selectedPhotoFoodId = null;
      let ocrResultData = null; // temporär zwischengespeicherte OCR-Werte

      function showView(viewId) {
        ['home-view','photo-view','manual-view','settings-view'].forEach(v => document.getElementById(v).classList.add('hidden'));
        document.getElementById(viewId+'-view').classList.remove('hidden');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`[data-view="${viewId}"]`).classList.add('active');
        currentView = viewId;
        if (viewId === 'home') refreshHome();
        if (viewId === 'manual') loadCustomFoodSelect();
        if (viewId === 'photo') loadPhotoFoodsList();
      }
      document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => showView(btn.dataset.view)));

      // ---------- FOTO-OCR ----------
      const photoInput = document.getElementById('photo-input');
      const takePhotoBtn = document.getElementById('take-photo-btn');
      const photoPreview = document.getElementById('photo-preview');
      const ocrStatus = document.getElementById('ocr-status');
      const ocrResultDiv = document.getElementById('ocr-result');
      const ocrName = document.getElementById('ocr-name');
      const ocrKcal = document.getElementById('ocr-kcal');
      const ocrProtein = document.getElementById('ocr-protein');
      const ocrPackWeight = document.getElementById('ocr-pack-weight');

      takePhotoBtn.addEventListener('click', () => {
        photoInput.click();
      });

      photoInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        // Vorschau anzeigen
        const reader = new FileReader();
        reader.onload = (ev) => {
          photoPreview.src = ev.target.result;
          photoPreview.classList.remove('hidden');
        };
        reader.readAsDataURL(file);

        ocrStatus.textContent = 'Texterkennung läuft... (deutsch)';
        ocrResultDiv.classList.add('hidden');
        try {
          const { data: { text } } = await Tesseract.recognize(file, 'deu', {
            logger: m => {
              if (m.status === 'recognizing text') {
                ocrStatus.textContent = `Erkenne Text... ${Math.round(m.progress * 100)}%`;
              }
            }
          });
          ocrStatus.textContent = 'Fertig. Bitte Werte prüfen.';
          const parsed = parseNutritionText(text);
          ocrName.value = parsed.name || '';
          ocrKcal.value = parsed.kcal || '';
          ocrProtein.value = parsed.protein || '';
          ocrPackWeight.value = parsed.packWeight || '';
          ocrResultDiv.classList.remove('hidden');
          ocrResultData = { ...parsed, imageDataUrl: photoPreview.src };
        } catch (err) {
          ocrStatus.textContent = 'Fehler: ' + err.message;
        }
      });

      function parseNutritionText(text) {
        // Suche nach Kalorien (kcal) und Protein (g) pro 100g oder pro Portion
        const lines = text.split(/\r?\n/);
        let kcal = null, protein = null, name = '', packWeight = null;
        const kcalRegex = /(?:brennwert|energie|kalorien)[:\s]*(\d+[\.,]?\d*)\s*(?:kcal|kj)/i;
        const proteinRegex = /(?:eiweiß|protein)[:\s]*(\d+[\.,]?\d*)\s*g/i;
        // Versuche zuerst pro 100g zu identifizieren
        for (const line of lines) {
          const kcalMatch = line.match(kcalRegex);
          if (kcalMatch) {
            let val = parseFloat(kcalMatch[1].replace(',', '.'));
            if (line.toLowerCase().includes('kj') && !line.toLowerCase().includes('kcal')) {
              val = val / 4.184; // kJ in kcal umrechnen
            }
            kcal = Math.round(val);
          }
          const proteinMatch = line.match(proteinRegex);
          if (proteinMatch) {
            protein = parseFloat(proteinMatch[1].replace(',', '.'));
          }
          // Einfache Erkennung von "100 g" oder "pro 100g" etc.
          if (line.includes('100 g') || line.includes('100g')) {
            // nichts, Bestätigung, dass es pro 100g ist
          }
        }
        // Falls keine Werte pro 100g gefunden, versuche es mit pro Portion (und frage nach Gewicht)
        if (!kcal) {
          // Fallback: erste Zahl, die wie kcal aussieht
          const genericKcal = text.match(/(\d+)\s*kcal/);
          if (genericKcal) kcal = parseInt(genericKcal[1]);
        }
        // Packungsgewicht aus Text extrahieren (z.B. "200 g", "500g")
        const weightMatch = text.match(/(\d+)\s*g\b/);
        if (weightMatch) packWeight = parseInt(weightMatch[1]);
        // Name: die erste Zeile, die kein Nährwert ist
        for (const line of lines) {
          if (!line.match(/brennwert|energie|eiweiß|protein|kohlenhydrate|fett|davon|gesättigte|zucker|salz|nährwerte|durchschnitt/i) && line.trim().length > 3) {
            name = line.trim().substring(0, 30); // auf 30 Zeichen kürzen
            break;
          }
        }
        return { kcal, protein, name, packWeight };
      }

      document.getElementById('save-ocr-btn').addEventListener('click', async () => {
        const name = ocrName.value.trim() || 'Unbekannt';
        const kcal = parseFloat(ocrKcal.value);
        const protein = parseFloat(ocrProtein.value);
        const packWeight = parseFloat(ocrPackWeight.value) || null;
        if (isNaN(kcal) || isNaN(protein)) {
          alert('Bitte Kalorien und Protein eingeben.');
          return;
        }
        // In photoFoods speichern
        const food = { name, kcal_per100: kcal, protein_per100: protein, pack_weight: packWeight };
        await addPhotoFood(food);
        ocrResultDiv.classList.add('hidden');
        photoPreview.classList.add('hidden');
        photoInput.value = '';
        ocrStatus.textContent = 'Gespeichert!';
        loadPhotoFoodsList();
      });

      // ---------- Foto-Lebensmittel DB ----------
      function addPhotoFood(food) {
        return new Promise(resolve => {
          const tx = db.transaction('photoFoods','readwrite');
          tx.objectStore('photoFoods').add(food).onsuccess = resolve;
        });
      }
      function getAllPhotoFoods() {
        return new Promise(resolve => {
          const tx = db.transaction('photoFoods','readonly');
          tx.objectStore('photoFoods').getAll().onsuccess = e => resolve(e.target.result);
        });
      }
      function deletePhotoFood(id) {
        return new Promise(resolve => {
          const tx = db.transaction('photoFoods','readwrite');
          tx.objectStore('photoFoods').delete(id).onsuccess = resolve;
        });
      }

      async function loadPhotoFoodsList() {
        const list = document.getElementById('saved-foods-list');
        const foods = await getAllPhotoFoods();
        if (foods.length === 0) {
          list.innerHTML = '<p class="small">Noch keine fotografierten Lebensmittel.</p>';
        } else {
          list.innerHTML = foods.map(f => `
            <div class="food-item">
              <div>
                <strong>${f.name}</strong><br>
                <span class="small">${f.kcal_per100} kcal, ${f.protein_per100}g Protein / 100g</span>
                ${f.pack_weight ? `<br><span class="small">Packung: ${f.pack_weight}g</span>` : ''}
              </div>
              <div style="display:flex; gap:0.3rem;">
                <button class="secondary" onclick="quickAddPhotoFood(${f.id}, '${f.name.replace(/'/g, "\\'")}', ${f.kcal_per100}, ${f.protein_per100})">➕</button>
                <button class="danger" onclick="deletePhotoFoodHandler(${f.id})">✕</button>
              </div>
            </div>
          `).join('');
        }
      }

      window.quickAddPhotoFood = (id, name, kcal, protein) => {
        selectedPhotoFoodId = id;
        document.getElementById('add-food-name').textContent = name;
        document.getElementById('add-food-kcal').textContent = kcal;
        document.getElementById('add-food-protein').textContent = protein;
        document.getElementById('add-food-amount').value = 100;
        document.getElementById('add-food-dialog').classList.remove('hidden');
      };

      document.getElementById('add-food-cancel-btn').onclick = () => {
        document.getElementById('add-food-dialog').classList.add('hidden');
      };

      document.getElementById('add-food-confirm-btn').onclick = async () => {
        const amount = parseFloat(document.getElementById('add-food-amount').value);
        if (isNaN(amount) || amount <= 0) return;
        const foods = await getAllPhotoFoods();
        const food = foods.find(f => f.id === selectedPhotoFoodId);
        if (!food) return;
        const kcal = (food.kcal_per100 * amount) / 100;
        const protein = (food.protein_per100 * amount) / 100;
        await addLogEntry(food.name, amount, kcal, protein);
        document.getElementById('add-food-dialog').classList.add('hidden');
        showView('home');
      };

      window.deletePhotoFoodHandler = async (id) => {
        if (confirm('Lebensmittel löschen?')) {
          await deletePhotoFood(id);
          loadPhotoFoodsList();
        }
      };

      // ---------- Manuelle Eingabe (wie gehabt) ----------
      async function loadCustomFoodSelect() {
        const select = document.getElementById('custom-food-select');
        select.innerHTML = '<option value="">-- Eigenes Lebensmittel --</option>';
        const foods = await getAllCustomFoods();
        foods.forEach(f => {
          const opt = document.createElement('option');
          opt.value = f.id;
          opt.textContent = `${f.name} (${f.kcal_per100} kcal, ${f.protein_per100}g/100g)`;
          select.appendChild(opt);
        });
        selectedCustomFoodId = null;
        document.getElementById('new-food-name').value = '';
        document.getElementById('new-food-kcal').value = '';
        document.getElementById('new-food-protein').value = '';
        document.getElementById('new-food-portion-desc').value = '';
        document.getElementById('manual-amount').value = 100;
        document.getElementById('manual-unit').value = 'g';
      }
      document.getElementById('custom-food-select').onchange = function() { selectedCustomFoodId = this.value ? Number(this.value) : null; };
      document.getElementById('add-manual-btn').onclick = async () => {
        let name, kcal_per100, protein_per100, portionDesc = null;
        const unit = document.getElementById('manual-unit').value;
        const amount = parseFloat(document.getElementById('manual-amount').value);
        if (selectedCustomFoodId) {
          const foods = await getAllCustomFoods();
          const food = foods.find(f => f.id === selectedCustomFoodId);
          if (!food) return;
          name = food.name; kcal_per100 = food.kcal_per100; protein_per100 = food.protein_per100;
          portionDesc = food.portion_desc || null;
        } else {
          name = document.getElementById('new-food-name').value.trim();
          kcal_per100 = parseFloat(document.getElementById('new-food-kcal').value);
          protein_per100 = parseFloat(document.getElementById('new-food-protein').value);
          portionDesc = document.getElementById('new-food-portion-desc').value.trim() || null;
          if (!name || isNaN(kcal_per100) || isNaN(protein_per100)) return alert('Bitte ausfüllen.');
          await addCustomFood({ name, kcal_per100, protein_per100, portion_desc: portionDesc });
        }
        let amountInGrams = amount;
        if (unit === 'portion' && portionDesc) {
          const match = portionDesc.match(/(\d+)\s*g/i);
          if (match) amountInGrams = parseFloat(match[1]) * amount;
          else return alert('Portionsbeschreibung benötigt Gramm-Angabe (z.B. 1 Becher=150g).');
        }
        const kcal = (kcal_per100 * amountInGrams) / 100;
        const protein = (protein_per100 * amountInGrams) / 100;
        await addLogEntry(name, amountInGrams, kcal, protein, unit === 'portion' ? `${amount} Portion(en)` : null);
        showView('home');
      };
      async function addCustomFood(food) { return new Promise(resolve => { const tx = db.transaction('customFoods','readwrite'); tx.objectStore('customFoods').add(food).onsuccess = resolve; }); }
      async function getAllCustomFoods() { return new Promise(resolve => { const tx = db.transaction('customFoods','readonly'); tx.objectStore('customFoods').getAll().onsuccess = e => resolve(e.target.result); }); }

      // ---------- Log & Home ----------
      async function addLogEntry(name, amount, kcal, protein, unitText = null) {
        const entry = { timestamp: new Date().toISOString(), date: new Date().toISOString().slice(0,10), name, amount, kcal: Math.round(kcal), protein: parseFloat(protein.toFixed(1)), unit: unitText || `${amount}g` };
        return new Promise(resolve => { const tx = db.transaction('logs','readwrite'); tx.objectStore('logs').add(entry).onsuccess = resolve; });
      }
      async function getTodayLogs() {
        const today = new Date().toISOString().slice(0,10);
        return new Promise(resolve => { const tx = db.transaction('logs','readonly'); tx.objectStore('logs').getAll().onsuccess = e => resolve(e.target.result.filter(l => l.date === today)); });
      }
      async function deleteLogEntry(id) { return new Promise(resolve => { const tx = db.transaction('logs','readwrite'); tx.objectStore('logs').delete(id).onsuccess = resolve; }); }
      window.deleteEntry = async (id) => { if (confirm('Eintrag löschen?')) { await deleteLogEntry(id); refreshHome(); } };
      async function refreshHome() {
        const logs = await getTodayLogs();
        const [goalKcal, goalProtein] = await Promise.all([getSetting('goalKcal',2900), getSetting('goalProtein',175)]);
        const totalKcal = logs.reduce((s,e) => s + e.kcal, 0);
        const totalProtein = logs.reduce((s,e) => s + e.protein, 0);
        document.getElementById('kcal-display').textContent = `${totalKcal} / ${goalKcal} kcal`;
        document.getElementById('protein-display').textContent = `${totalProtein.toFixed(1)} / ${goalProtein} g`;
        document.getElementById('kcal-bar').style.width = Math.min(100, (totalKcal/goalKcal)*100)+'%';
        document.getElementById('protein-bar').style.width = Math.min(100, (totalProtein/goalProtein)*100)+'%';
        const list = document.getElementById('log-list');
        if (!logs.length) list.innerHTML = '<p class="small">Noch keine Einträge.</p>';
        else list.innerHTML = logs.sort((a,b)=> b.timestamp.localeCompare(a.timestamp)).map(e => `
          <div class="log-entry">
            <span><strong>${e.name}</strong><br><span class="small">${e.unit} | ${new Date(e.timestamp).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}</span></span>
            <span><span class="macro">${e.kcal} kcal</span> | ${e.protein}g</span>
            <button class="delete-entry" onclick="deleteEntry(${e.id})">✕</button>
          </div>`).join('');
      }

      function getSetting(key, def) { return new Promise(resolve => { const tx = db.transaction('settings','readonly'); tx.objectStore('settings').get(key).onsuccess = e => resolve(e.target.result?.value ?? def); }); }
      function setSetting(key, value) { return new Promise(resolve => { const tx = db.transaction('settings','readwrite'); tx.objectStore('settings').put({key, value}); tx.oncomplete = resolve; }); }
      document.getElementById('save-settings-btn').onclick = async () => {
        await setSetting('goalKcal', parseInt(document.getElementById('goal-kcal').value)||2900);
        await setSetting('goalProtein', parseInt(document.getElementById('goal-protein').value)||175);
        alert('Gespeichert.'); showView('home');
      };
      async function initSettingsForm() {
        document.getElementById('goal-kcal').value = await getSetting('goalKcal',2900);
        document.getElementById('goal-protein').value = await getSetting('goalProtein',175);
      }

      async function initApp() {
        await initSettingsForm();
        showView('home');
      }
    })();
  </script>
</body>
</html>
