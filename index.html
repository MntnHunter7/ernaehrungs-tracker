<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mein Ernährungstracker</title>
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Ern%C3%A4hrungstracker%22%2C%22short_name%22%3A%22Tracker%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%231e1e1e%22%2C%22theme_color%22%3A%22%234caf50%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%20100%20100'%3E%3Crect%20width%3D'100'%20height%3D'100'%20rx%3D'20'%20fill%3D'%234caf50'%2F%3E%3Ctext%20x%3D'50'%20y%3D'68'%20font-size%3D'50'%20text-anchor%3D'middle'%20fill%3D'white'%20font-family%3D'sans-serif'%3E%E2%9A%96%3C%2Ftext%3E%3C%2Fsvg%3E%22%2C%22sizes%22%3A%22100x100%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #1e1e1e;
      color: #e0e0e0;
      max-width: 480px;
      margin: 0 auto;
      padding: 1rem;
      line-height: 1.4;
    }
    h1, h2 { color: #4caf50; margin-bottom: 0.5rem; }
    .card {
      background: #2a2a2a;
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .progress-bar {
      height: 20px;
      background: #444;
      border-radius: 10px;
      overflow: hidden;
      margin: 0.5rem 0;
    }
    .progress-fill {
      height: 100%;
      background: #4caf50;
      transition: width 0.3s;
    }
    .flex-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }
    button, .btn {
      background: #4caf50;
      color: white;
      border: none;
      padding: 0.7rem 1rem;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      text-align: center;
      display: inline-block;
    }
    button.secondary {
      background: #555;
    }
    button:active { opacity: 0.8; }
    input, select {
      background: #333;
      color: white;
      border: 1px solid #555;
      padding: 0.7rem;
      border-radius: 8px;
      font-size: 1rem;
      width: 100%;
    }
    .hidden { display: none !important; }
    #scanner-container {
      width: 100%;
      max-width: 300px;
      margin: 0 auto;
    }
    .log-entry {
      border-bottom: 1px solid #444;
      padding: 0.5rem 0;
      display: flex;
      justify-content: space-between;
    }
    .badge {
      background: #333;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      font-size: 0.8rem;
    }
    nav {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    nav button { flex: 1; }
    #scan-view, #manual-view, #foods-view, #settings-view {
      animation: fadeIn 0.2s;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .macro { font-weight: bold; }
    .small { font-size: 0.9rem; color: #aaa; }
  </style>
</head>
<body>
  <!-- Navigation -->
  <nav>
    <button id="nav-home" class="secondary">🏠 Heute</button>
    <button id="nav-scan" class="secondary">📷 Scannen</button>
    <button id="nav-manual" class="secondary">✍️ Manuell</button>
    <button id="nav-foods" class="secondary">📦 Lebensmittel</button>
    <button id="nav-settings" class="secondary">⚙️</button>
  </nav>

  <!-- Home View -->
  <div id="home-view">
    <h1>Heute</h1>
    <div class="card">
      <div class="flex-row"><span>Kalorien</span><span id="kcal-display">0 / 2900 kcal</span></div>
      <div class="progress-bar"><div id="kcal-bar" class="progress-fill" style="width:0%"></div></div>
      <div class="flex-row"><span>Protein</span><span id="protein-display">0 / 175 g</span></div>
      <div class="progress-bar"><div id="protein-bar" class="progress-fill" style="width:0%"></div></div>
    </div>
    <h2>Mahlzeiten</h2>
    <div id="log-list" class="card" style="min-height: 100px;">
      <p class="small">Noch keine Einträge.</p>
    </div>
  </div>

  <!-- Scan View -->
  <div id="scan-view" class="hidden">
    <h1>Barcode scannen</h1>
    <div id="scanner-container"></div>
    <div id="scan-result" class="hidden card">
      <h3 id="scan-product-name"></h3>
      <p>pro 100g: <span id="scan-kcal-per100"></span> kcal, <span id="scan-protein-per100"></span> g Protein</p>
      <div class="flex-row" style="margin-top:0.5rem;">
        <label>Menge (g): <input type="number" id="scan-amount" value="100" min="1" step="1"></label>
      </div>
      <div class="flex-row" style="margin-top:0.5rem; gap: 0.3rem; flex-wrap: wrap;">
        <button class="secondary" onclick="applySlice(1)">1 Scheibe</button>
        <button class="secondary" onclick="applySlice(2)">2 Scheiben</button>
        <button class="secondary" onclick="applySlice(3)">3 Scheiben</button>
        <span class="small" id="slice-weight-label">(25g/Scheibe)</span>
      </div>
      <button id="add-scanned-btn" style="margin-top:1rem;">Hinzufügen</button>
      <button class="secondary" id="cancel-scan-btn">Abbrechen</button>
    </div>
    <div id="scan-loading" class="hidden small">Suche Produkt...</div>
  </div>

  <!-- Manual View -->
  <div id="manual-view" class="hidden">
    <h1>Manuell eintragen</h1>
    <div class="card">
      <select id="custom-food-select">
        <option value="">-- Eigenes Lebensmittel wählen --</option>
      </select>
      <p class="small">oder neu anlegen (wird gespeichert):</p>
      <input type="text" id="new-food-name" placeholder="Name (z.B. Hähnchenbrust)">
      <div class="flex-row">
        <input type="number" id="new-food-kcal" placeholder="kcal/100g" step="0.1">
        <input type="number" id="new-food-protein" placeholder="Protein/100g" step="0.1">
      </div>
      <input type="text" id="new-food-portion-desc" placeholder="Portionsbeschreibung (z.B. 1 Becher=150g)">
      <div class="flex-row" style="margin-top:0.5rem;">
        <label>Menge: <input type="number" id="manual-amount" value="100" min="1" step="1"></label>
        <select id="manual-unit">
          <option value="g">g</option>
          <option value="portion">Portion</option>
        </select>
      </div>
      <button id="add-manual-btn">Hinzufügen</button>
    </div>
  </div>

  <!-- Foods View -->
  <div id="foods-view" class="hidden">
    <h1>Meine Lebensmittel</h1>
    <div id="custom-foods-list" class="card"></div>
    <button id="delete-food-btn" class="secondary" style="margin-top:1rem;">Ausgewähltes löschen</button>
  </div>

  <!-- Settings View -->
  <div id="settings-view" class="hidden">
    <h1>Einstellungen</h1>
    <div class="card">
      <label>Kalorienziel: <input type="number" id="goal-kcal" value="2900"></label>
      <label>Proteinziel (g): <input type="number" id="goal-protein" value="175"></label>
      <label>Gewicht pro Scheibe (g): <input type="number" id="slice-weight" value="25"></label>
      <button id="save-settings-btn">Speichern</button>
    </div>
  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    // ---------- DATENBANK ----------
    const DB_NAME = 'ernaehrungsTracker';
    let db;
    const request = indexedDB.open(DB_NAME, 2);
    request.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains('logs')) {
        db.createObjectStore('logs', { keyPath: 'id', autoIncrement: true });
      }
      if (!db.objectStoreNames.contains('customFoods')) {
        db.createObjectStore('customFoods', { keyPath: 'id', autoIncrement: true });
      }
      if (!db.objectStoreNames.contains('settings')) {
        db.createObjectStore('settings', { keyPath: 'key' });
      }
    };
    request.onsuccess = (e) => {
      db = e.target.result;
      initApp();
    };

    // ---------- GLOBALE VARIABLEN ----------
    let currentView = 'home';
    let scannedProductData = null; // { name, kcal_per100, protein_per100 }
    let selectedCustomFoodId = null;
    let scanner = null;

    // ---------- NAVIGATION ----------
    function showView(viewId) {
      document.querySelectorAll('#home-view, #scan-view, #manual-view, #foods-view, #settings-view').forEach(el => el.classList.add('hidden'));
      document.getElementById(viewId + '-view').classList.remove('hidden');
      currentView = viewId;
      if (viewId === 'home') refreshHome();
      if (viewId === 'foods') loadCustomFoodsList();
      if (viewId === 'manual') loadCustomFoodSelect();
      if (viewId === 'scan') startScanner();
      else stopScanner();
    }

    document.getElementById('nav-home').onclick = () => showView('home');
    document.getElementById('nav-scan').onclick = () => showView('scan');
    document.getElementById('nav-manual').onclick = () => showView('manual');
    document.getElementById('nav-foods').onclick = () => showView('foods');
    document.getElementById('nav-settings').onclick = () => showView('settings');

    // ---------- SCANNER ----------
    function startScanner() {
      if (scanner) return;
      const container = document.getElementById('scanner-container');
      container.innerHTML = '';
      scanner = new Html5Qrcode('scanner-container');
      scanner.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: 250 },
        (decodedText) => {
          // Barcode erkannt
          stopScanner();
          fetchProduct(decodedText);
        },
        (error) => { /* ignorieren */ }
      ).catch(err => {
        alert('Kamera nicht verfügbar: ' + err);
        stopScanner();
      });
    }

    function stopScanner() {
      if (scanner) {
        scanner.stop().then(() => {
          scanner.clear();
          scanner = null;
          document.getElementById('scanner-container').innerHTML = '';
        }).catch(() => {});
      }
    }

    async function fetchProduct(barcode) {
      document.getElementById('scan-loading').classList.remove('hidden');
      document.getElementById('scan-result').classList.add('hidden');
      try {
        const response = await fetch(`https://de.openfoodfacts.org/api/v2/product/${barcode}.json`);
        const data = await response.json();
        if (data.status === 1 && data.product) {
          const p = data.product;
          const kcal = p.nutriments?.['energy-kcal_100g'] || p.nutriments?.['energy-kcal'] || 0;
          const protein = p.nutriments?.proteins_100g || p.nutriments?.proteins || 0;
          scannedProductData = {
            name: p.product_name_de || p.product_name || 'Unbekanntes Produkt',
            kcal_per100: parseFloat(kcal),
            protein_per100: parseFloat(protein)
          };
          document.getElementById('scan-product-name').textContent = scannedProductData.name;
          document.getElementById('scan-kcal-per100').textContent = scannedProductData.kcal_per100.toFixed(1);
          document.getElementById('scan-protein-per100').textContent = scannedProductData.protein_per100.toFixed(1);
          document.getElementById('scan-amount').value = 100;
          document.getElementById('scan-result').classList.remove('hidden');
        } else {
          alert('Produkt nicht gefunden.');
        }
      } catch (e) {
        alert('Fehler beim Abrufen: ' + e.message);
      }
      document.getElementById('scan-loading').classList.add('hidden');
    }

    function applySlice(count) {
      getSetting('sliceWeight', 25).then(weightPerSlice => {
        document.getElementById('scan-amount').value = count * weightPerSlice;
      });
    }

    document.getElementById('add-scanned-btn').onclick = async () => {
      if (!scannedProductData) return;
      const amount = parseFloat(document.getElementById('scan-amount').value);
      if (isNaN(amount) || amount <= 0) return;
      const kcal = (scannedProductData.kcal_per100 * amount) / 100;
      const protein = (scannedProductData.protein_per100 * amount) / 100;
      await addLogEntry(scannedProductData.name, amount, kcal, protein);
      scannedProductData = null;
      document.getElementById('scan-result').classList.add('hidden');
      showView('home');
    };

    document.getElementById('cancel-scan-btn').onclick = () => {
      scannedProductData = null;
      document.getElementById('scan-result').classList.add('hidden');
      startScanner();
    };

    // ---------- MANUELLE EINGABE ----------
    async function loadCustomFoodSelect() {
      const select = document.getElementById('custom-food-select');
      select.innerHTML = '<option value="">-- Eigenes Lebensmittel wählen --</option>';
      const foods = await getAllCustomFoods();
      foods.forEach(f => {
        const opt = document.createElement('option');
        opt.value = f.id;
        opt.textContent = `${f.name} (${f.kcal_per100} kcal, ${f.protein_per100}g Protein/100g)`;
        select.appendChild(opt);
      });
      selectedCustomFoodId = null;
      document.getElementById('new-food-name').value = '';
      document.getElementById('new-food-kcal').value = '';
      document.getElementById('new-food-protein').value = '';
      document.getElementById('new-food-portion-desc').value = '';
      document.getElementById('manual-amount').value = 100;
      document.getElementById('manual-unit').value = 'g';
    }

    document.getElementById('custom-food-select').onchange = function() {
      const id = this.value;
      if (id) {
        selectedCustomFoodId = Number(id);
        // Felder leeren, da ausgewählt
      } else {
        selectedCustomFoodId = null;
      }
    };

    document.getElementById('add-manual-btn').onclick = async () => {
      let name, kcal_per100, protein_per100, portionDesc = null;
      const unit = document.getElementById('manual-unit').value;
      const amount = parseFloat(document.getElementById('manual-amount').value);

      if (selectedCustomFoodId) {
        const foods = await getAllCustomFoods();
        const food = foods.find(f => f.id === selectedCustomFoodId);
        if (!food) return;
        name = food.name;
        kcal_per100 = food.kcal_per100;
        protein_per100 = food.protein_per100;
        portionDesc = food.portion_desc || null;
      } else {
        name = document.getElementById('new-food-name').value.trim();
        kcal_per100 = parseFloat(document.getElementById('new-food-kcal').value);
        protein_per100 = parseFloat(document.getElementById('new-food-protein').value);
        portionDesc = document.getElementById('new-food-portion-desc').value.trim() || null;
        if (!name || isNaN(kcal_per100) || isNaN(protein_per100)) {
          alert('Bitte Name, kcal und Protein ausfüllen.');
          return;
        }
        // Neues Lebensmittel speichern
        await addCustomFood({ name, kcal_per100, protein_per100, portion_desc: portionDesc });
      }

      // Menge in Gramm umrechnen, falls Portion gewählt
      let amountInGrams = amount;
      if (unit === 'portion' && portionDesc) {
        const match = portionDesc.match(/(\d+)\s*g/i);
        if (match) {
          amountInGrams = parseFloat(match[1]) * amount;
        } else {
          alert('Portionsbeschreibung enthält keine Gramm-Angabe (z.B. 1 Becher=150g). Bitte in Gramm eingeben.');
          return;
        }
      }

      const kcal = (kcal_per100 * amountInGrams) / 100;
      const protein = (protein_per100 * amountInGrams) / 100;
      await addLogEntry(name, amountInGrams, kcal, protein, unit === 'portion' ? `${amount} Portion(en)` : null);
      showView('home');
    };

    // ---------- EIGENE LEBENSMITTEL ----------
    async function addCustomFood(food) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction('customFoods', 'readwrite');
        const store = tx.objectStore('customFoods');
        const req = store.add(food);
        req.onsuccess = resolve;
        req.onerror = reject;
      });
    }

    async function getAllCustomFoods() {
      return new Promise((resolve) => {
        const tx = db.transaction('customFoods', 'readonly');
        const store = tx.objectStore('customFoods');
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result);
      });
    }

    async function deleteCustomFood(id) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction('customFoods', 'readwrite');
        const store = tx.objectStore('customFoods');
        const req = store.delete(id);
        req.onsuccess = resolve;
        req.onerror = reject;
      });
    }

    async function loadCustomFoodsList() {
      const list = document.getElementById('custom-foods-list');
      const foods = await getAllCustomFoods();
      if (foods.length === 0) {
        list.innerHTML = '<p class="small">Keine eigenen Lebensmittel.</p>';
      } else {
        list.innerHTML = foods.map(f => `
          <div class="log-entry">
            <span><strong>${f.name}</strong><br><span class="small">${f.kcal_per100} kcal, ${f.protein_per100}g Protein/100g ${f.portion_desc ? '| ' + f.portion_desc : ''}</span></span>
            <button class="secondary" onclick="selectFoodForDeletion(${f.id})">✕</button>
          </div>
        `).join('');
      }
    }

    window.selectFoodForDeletion = (id) => {
      selectedCustomFoodId = id;
      document.getElementById('delete-food-btn').style.display = 'block';
    };

    document.getElementById('delete-food-btn').onclick = async () => {
      if (selectedCustomFoodId && confirm('Lebensmittel löschen?')) {
        await deleteCustomFood(selectedCustomFoodId);
        selectedCustomFoodId = null;
        loadCustomFoodsList();
        document.getElementById('delete-food-btn').style.display = 'none';
      }
    };

    // ---------- LOGBUCH ----------
    async function addLogEntry(name, amountGrams, kcal, protein, customUnitText = null) {
      const entry = {
        timestamp: new Date().toISOString(),
        date: new Date().toISOString().slice(0, 10),
        name,
        amount: amountGrams,
        kcal: Math.round(kcal),
        protein: parseFloat(protein.toFixed(1)),
        unit: customUnitText || `${amountGrams}g`
      };
      return new Promise((resolve, reject) => {
        const tx = db.transaction('logs', 'readwrite');
        const store = tx.objectStore('logs');
        const req = store.add(entry);
        req.onsuccess = resolve;
        req.onerror = reject;
      });
    }

    async function getTodayLogs() {
      const today = new Date().toISOString().slice(0, 10);
      return new Promise((resolve) => {
        const tx = db.transaction('logs', 'readonly');
        const store = tx.objectStore('logs');
        const req = store.getAll();
        req.onsuccess = () => {
          const logs = req.result.filter(e => e.date === today);
          resolve(logs);
        };
      });
    }

    async function refreshHome() {
      const logs = await getTodayLogs();
      const [goalKcal, goalProtein] = await Promise.all([
        getSetting('goalKcal', 2900),
        getSetting('goalProtein', 175)
      ]);
      const totalKcal = logs.reduce((sum, e) => sum + e.kcal, 0);
      const totalProtein = logs.reduce((sum, e) => sum + e.protein, 0);
      document.getElementById('kcal-display').textContent = `${totalKcal} / ${goalKcal} kcal`;
      document.getElementById('protein-display').textContent = `${totalProtein.toFixed(1)} / ${goalProtein} g`;
      document.getElementById('kcal-bar').style.width = Math.min(100, (totalKcal / goalKcal) * 100) + '%';
      document.getElementById('protein-bar').style.width = Math.min(100, (totalProtein / goalProtein) * 100) + '%';

      const list = document.getElementById('log-list');
      if (logs.length === 0) {
        list.innerHTML = '<p class="small">Noch keine Einträge.</p>';
      } else {
        list.innerHTML = logs.sort((a,b) => b.timestamp.localeCompare(a.timestamp)).map(e => `
          <div class="log-entry">
            <span><strong>${e.name}</strong><br><span class="small">${e.unit} | ${new Date(e.timestamp).toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'})}</span></span>
            <span><span class="macro">${e.kcal} kcal</span> | ${e.protein}g Protein</span>
          </div>
        `).join('');
      }
    }

    // ---------- EINSTELLUNGEN ----------
    async function getSetting(key, defaultValue) {
      return new Promise((resolve) => {
        const tx = db.transaction('settings', 'readonly');
        const store = tx.objectStore('settings');
        const req = store.get(key);
        req.onsuccess = () => {
          resolve(req.result ? req.result.value : defaultValue);
        };
      });
    }

    async function setSetting(key, value) {
      return new Promise((resolve) => {
        const tx = db.transaction('settings', 'readwrite');
        const store = tx.objectStore('settings');
        store.put({ key, value });
        tx.oncomplete = resolve;
      });
    }

    document.getElementById('save-settings-btn').onclick = async () => {
      await setSetting('goalKcal', parseInt(document.getElementById('goal-kcal').value) || 2900);
      await setSetting('goalProtein', parseInt(document.getElementById('goal-protein').value) || 175);
      await setSetting('sliceWeight', parseInt(document.getElementById('slice-weight').value) || 25);
      alert('Einstellungen gespeichert.');
      showView('home');
    };

    // Initial Einstellungen laden
    async function loadSettingsToForm() {
      document.getElementById('goal-kcal').value = await getSetting('goalKcal', 2900);
      document.getElementById('goal-protein').value = await getSetting('goalProtein', 175);
      document.getElementById('slice-weight').value = await getSetting('sliceWeight', 25);
    }

    // ---------- INIT ----------
    async function initApp() {
      await loadSettingsToForm();
      // Slice-Gewicht-Anzeige aktualisieren
      const sliceWeight = await getSetting('sliceWeight', 25);
      document.getElementById('slice-weight-label').textContent = `(${sliceWeight}g/Scheibe)`;
      showView('home');
    }

    // Slice-Weight-Label dynamisch aktualisieren bei Settings-Änderung (optional)
    // ---------- PWA Service Worker ----------
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register("data:application/javascript," + encodeURIComponent(
          "self.addEventListener('fetch', e => { e.respondWith(fetch(e.request).catch(() => caches.match(e.request))); });" +
          "self.addEventListener('install', e => { self.skipWaiting(); });"
        ));
      });
    }
  </script>
</body>
</html>
